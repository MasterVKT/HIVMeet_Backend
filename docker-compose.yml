services:
  # Base de données PostgreSQL
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: hivmeet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis pour cache et Celery
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # SMTP development inbox.  It accepts messages only inside this local
  # Compose environment and exposes no delivery outside the workstation.
  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Application Django
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=True
      - HIVMEET_DEPLOYMENT_ENVIRONMENT=development
      - KYC_SOCIAL_ACCESS_ENFORCEMENT=enforced
      - KYC_STORAGE_BACKEND=local
      - PRIVATE_STORAGE_LOCAL_ROOT=/app/private_uploads
      - KYC_DOCUMENT_RETENTION_DAYS=1
      - KYC_ANTIVIRUS_BACKEND=test
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=False
      - EMAIL_USE_SSL=False
      - DEFAULT_FROM_EMAIL=HIVMeet <noreply@hivmeet.invalid>
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/hivmeet_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # Celery Worker
  celery:
    build: .
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - HIVMEET_DEPLOYMENT_ENVIRONMENT=development
      - KYC_SOCIAL_ACCESS_ENFORCEMENT=enforced
      - KYC_STORAGE_BACKEND=local
      - PRIVATE_STORAGE_LOCAL_ROOT=/app/private_uploads
      - KYC_DOCUMENT_RETENTION_DAYS=1
      - KYC_ANTIVIRUS_BACKEND=test
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=False
      - EMAIL_USE_SSL=False
      - DEFAULT_FROM_EMAIL=HIVMeet <noreply@hivmeet.invalid>
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/hivmeet_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - mailpit
    command: celery -A hivmeet_backend worker -l info

  # Celery Beat (Scheduler)
  celery-beat:
    build: .
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - HIVMEET_DEPLOYMENT_ENVIRONMENT=development
      - KYC_SOCIAL_ACCESS_ENFORCEMENT=enforced
      - KYC_STORAGE_BACKEND=local
      - PRIVATE_STORAGE_LOCAL_ROOT=/app/private_uploads
      - KYC_DOCUMENT_RETENTION_DAYS=1
      - KYC_ANTIVIRUS_BACKEND=test
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=False
      - EMAIL_USE_SSL=False
      - DEFAULT_FROM_EMAIL=HIVMeet <noreply@hivmeet.invalid>
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/hivmeet_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - mailpit
    command: celery -A hivmeet_backend beat -l info

  # Flower (Monitoring Celery)
  flower:
    build: .
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A hivmeet_backend flower

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
